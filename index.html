<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyons Server Network</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            user-select: none;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #333;
        }
        h1 { margin-top: 0; font-size: 2rem; }
        p { color: #888; margin-bottom: 30px; font-size: 1rem; }
        .btn-group { display: flex; flex-direction: column; gap: 16px; }
        button {
            padding: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            color: white;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        button:active { transform: translateY(0); }
        .btn-creative { background: #2e7d32; }
        .btn-survival { background: #c62828; }
        #status { display: none; margin-top: 25px; font-style: italic; color: #aaa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lyons Server Network</h1>
        <p>Select a game mode to launch:</p>
        <div class="btn-group" id="buttons">
            <button class="btn-creative" onclick="launch('creative')">🎨 Creative Server</button>
            <button class="btn-survival" onclick="launch('survival')">⚔️ Survival Server</button>
        </div>
        <div id="status">Please wait... Starting game engine...</div>
    </div>

    <script>
        function launch(mode) {
            // 1. Give the browser a single-use launch token
            sessionStorage.setItem('launchMode', mode);

            // 2. Visual feedback
            document.getElementById("buttons").style.display = "none";
            const status = document.getElementById("status");
            status.style.display = "block";
            status.innerText = "Please wait... Starting " + mode.toUpperCase() + " server...";

            // 3. Navigate cleanly to the game (no ?mode= in the URL!)
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
